<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能花卉养殖系统</title>
    <style>
        /* =====================================================
           玻璃拟态主题系统（CSS 变量）
           ===================================================== */
        :root {
            --primary: #4a7c59;
            --primary-hover: #3c6648;
            --primary-deep: #3a6b47;
            --primary-light: #72b084;
            --primary-dark: #2f5d3a;
            --text-main: #333;
            --text-sub: #4a5a4f;
            --text-mute: #7a9480;
            --on-accent: #fff;
            --warn: #d48346;
            --danger: #c95b5b;
            --danger-hover: #a84747;
            --info: #648ca6;
            --glass: rgba(255,255,255,0.55);
            --glass-strong: rgba(255,255,255,0.78);
            --glass-weak: rgba(255,255,255,0.14);
            --glass-hover: rgba(255,255,255,0.30);
            --border-glass: rgba(255,255,255,0.5);
            --border-soft: #e5f0e7;
            --soft-bg: #f4f9f5;
            --soft-bg-strong: #e8f1eb;
            --input-bg: rgba(255,255,255,0.65);
            --bg-from: #eef7f0;
            --bg-mid: #f7fbf5;
            --bg-to: #e2efe5;
            --blob1: rgba(114,176,132,0.5);
            --blob2: rgba(100,140,166,0.36);
            --blob3: rgba(212,131,70,0.22);
            --blob4: rgba(47,93,58,0.30);
            --shadow-glass: 0 8px 32px rgba(31,60,40,0.12);
            --shadow-glass-lg: 0 18px 50px rgba(31,60,40,0.18);
            --grass-opacity: 0.45;
        }
                :root[data-theme="dark"] {
            --primary: #7cc08e;
            --primary-hover: #9bd4ab;
            --primary-deep: #63b57c;
            --primary-light: #8fd2a0;
            --primary-dark: #d9f1e0;
            --text-main: #edf5ef;
            --text-sub: #b6cdbd;
            --text-mute: #87a394;
            --on-accent: #0e1a13;
            --warn: #eda863;
            --danger: #e68585;
            --danger-hover: #cf6a6a;
            --info: #8fbcd6;
            --glass: rgba(24,39,31,0.55);
            --glass-strong: rgba(28,46,37,0.80);
            --glass-weak: rgba(255,255,255,0.09);
            --glass-hover: rgba(255,255,255,0.18);
            --border-glass: rgba(255,255,255,0.16);
            --border-soft: rgba(255,255,255,0.14);
            --soft-bg: rgba(52,78,64,0.55);
            --soft-bg-strong: rgba(66,96,80,0.62);
            --input-bg: rgba(255,255,255,0.08);
            --bg-from: #0c1410;
            --bg-mid: #14211a;
            --bg-to: #0a1310;
            --blob1: rgba(96,178,130,0.24);
            --blob2: rgba(76,150,206,0.16);
            --blob3: rgba(200,136,86,0.13);
            --blob4: rgba(108,172,144,0.20);
            --shadow-glass: 0 10px 34px rgba(0,0,0,0.45);
            --shadow-glass-lg: 0 20px 60px rgba(0,0,0,0.55);
            --grass-opacity: 0.12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: var(--soft-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,50 C30,30 40,70 50,50 C60,30 70,70 80,50' stroke='%23dcecd8' stroke-width='1.4' fill='none' opacity='0.45'/%3E%3Cpath d='M0,20 C10,10 20,30 30,20 C40,10 50,30 60,20' stroke='%23dcecd8' stroke-width='1.1' fill='none' opacity='0.35'/%3E%3Cpath d='M0,80 C10,70 20,90 30,80 C40,70 50,90 60,80' stroke='%23dcecd8' stroke-width='1.1' fill='none' opacity='0.35'/%3E%3C/svg%3E");
            color: #333;
            min-height: 100vh;
        }
        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 18px 60px;
        }
        /* ===== 顶部标题 ===== */
        .top-bar {
            text-align: center;
            margin-bottom: 22px;
        }
        .top-bar h1 {
            color: var(--primary-dark);
            font-size: 30px;
            letter-spacing: 2px;
        }
        .top-bar p {
            color: var(--text-mute);
            font-size: 14px;
            margin-top: 6px;
        }
        /* ===== 每日一花 ===== */
        .daily-flower {
            background: var(--glass-strong);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary-light);
            box-shadow: 0 3px 12px rgba(74,124,89,0.12);
        }
        .daily-flower h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 17px;
        }
        .knowledge-block {
            background: var(--soft-bg);
            padding: 12px 14px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-sub);
        }
        /* ===== 搜索框 ===== */
        .search-area {
            margin-bottom: 20px;
        }
        .search-area input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            font-size: 16px;
            background: var(--glass-strong);
            outline: none;
            transition: 0.2s;
        }
        .search-area input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(114,176,132,0.18);
        }
        .search-tip {
            font-size: 12px;
            color: var(--text-mute);
            margin-top: 6px;
            text-align: center;
        }
        /* ===== 首页三大模块 ===== */
        .home-module-wrap {
            display: grid;
            gap: 16px;
        }
        .home-card {
            background: var(--glass-strong);
            border-radius: 16px;
            padding: 24px 22px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid var(--border-soft);
            box-shadow: 0 2px 10px rgba(74,124,89,0.08);
        }
        .home-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(74,124,89,0.18);
        }
        .home-card h2 {
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 20px;
        }
        .home-card p {
            color: var(--text-mute);
            line-height: 1.6;
            font-size: 14px;
        }
        /* ===== 子页面 ===== */
        .sub-page {
            display: none;
        }
        .sub-page.active {
            display: block;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            padding: 9px 16px;
            border: none;
            border-radius: 10px;
            background: var(--soft-bg-strong);
            color: var(--primary-deep);
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn:hover {
            background: var(--soft-bg-strong);
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-bar button {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: var(--glass-strong);
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
        }
        .filter-bar button.active {
            background: var(--primary);
            color: var(--on-accent);
        }
        /* ===== 通用卡片 ===== */
        .card {
            background: var(--glass-strong);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 1px 6px rgba(74,124,89,0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover {
            box-shadow: 0 4px 14px rgba(74,124,89,0.15);
        }
        .card h4 {
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 17px;
        }
        .card p {
            color: var(--text-sub);
            line-height: 1.6;
            font-size: 13px;
            margin: 4px 0;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--on-accent);
        }
        .btn-danger {
            background: var(--danger);
            color: var(--on-accent);
        }
        .btn-link {
            background: transparent;
            color: var(--primary);
            text-decoration: underline;
            padding: 4px 0;
        }
        .input-item {
            margin: 12px 0;
        }
        .input-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-sub);
        }
        .input-item input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-soft);
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }
        .plant-day-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--on-accent);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 13px;
        }
        .sick-tag {
            display: inline-block;
            background: var(--warn);
            color: var(--on-accent);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .category-tag {
            display: inline-block;
            background: var(--info);
            color: var(--on-accent);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 12px;
        }
        .empty-tip {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-mute);
            font-size: 15px;
        }
        /* ===== 弹窗通用 ===== */
        .modal-wrap {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30,50,35,0.5);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
            z-index: 999;
            overflow-y: auto;
        }
        .modal-wrap.show {
            display: flex;
        }
        .modal {
            width: 100%;
            max-width: 680px;
            background: var(--glass-strong);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-soft);
        }
        .modal-header h3 {
            color: var(--primary-dark);
            font-size: 17px;
        }
        .modal-close {
            cursor: pointer;
            color: var(--text-mute);
            font-size: 15px;
            background: var(--soft-bg);
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
        }
        .modal-close:hover {
            background: var(--soft-bg);
            color: var(--primary-dark);
        }
        .search-result-item {
            cursor: pointer;
            padding: 14px 16px;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: 0.2s;
            background: var(--soft-bg);
        }
        .search-result-item:hover {
            border-color: var(--primary-light);
            box-shadow: 0 3px 10px rgba(74,124,89,0.14);
        }
        .search-result-item h4 {
            color: var(--primary-dark);
            font-size: 16px;
            margin-bottom: 5px;
        }
        .search-result-item p {
            color: var(--text-mute);
            font-size: 13px;
            line-height: 1.5;
        }
        .search-result-item .match-type {
            font-size: 12px;
            color: var(--warn);
            margin-left: 8px;
        }
        /* ===== 病虫害分组卡片（可点击查看详情）===== */
        .disease-group-card {
            background: var(--glass-strong);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 1px 6px rgba(74,124,89,0.06);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .disease-group-card:hover {
            border-color: var(--warn);
            box-shadow: 0 4px 14px rgba(212,131,70,0.16);
            transform: translateY(-2px);
        }
        .disease-group-card .dg-left {
            flex: 1;
            min-width: 0;
        }
        .disease-group-card .dg-left h4 {
            color: var(--primary-dark);
            font-size: 17px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .disease-group-card .dg-left p {
            color: var(--text-mute);
            font-size: 13px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .disease-count-tag {
            display: inline-block;
            background: var(--warn);
            color: var(--on-accent);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 12px;
            white-space: nowrap;
        }
        .dg-arrow {
            color: var(--warn);
            font-size: 20px;
            flex-shrink: 0;
        }
        .disease-sub-title {
            color: var(--primary);
            font-size: 15px;
            margin: 18px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-soft);
        }
        /* ===== 花卉图鉴 ===== */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .album-card {
            background: var(--glass-strong);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-soft);
            box-shadow: 0 1px 6px rgba(74,124,89,0.06);
            transition: 0.2s;
            text-align: center;
            padding-bottom: 10px;
        }
        .album-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(74,124,89,0.16);
        }
        .album-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-soft);
        }
        .album-card p {
            padding: 8px 6px 0;
            color: var(--primary-dark);
            font-size: 14px;
            font-weight: bold;
        }
        /* ===== 攻略卡片带缩略图 ===== */
        .guide-card {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .guide-card .gc-img {
            width: 86px;
            height: 86px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-soft);
        }
        .guide-card .gc-main {
            flex: 1;
            min-width: 0;
        }
        .disease-count-badge {
            display: inline-block;
            background: var(--warn);
            color: var(--on-accent);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 6px;
        }
        /* ===== 图鉴图片点击放大 ===== */
        .album-img-wrap {
            overflow: hidden;
            cursor: zoom-in;
            position: relative;
        }
        .album-img-wrap img {
            transition: transform 0.35s ease;
        }
        .album-img-wrap:hover img {
            transform: scale(1.1);
        }
        .album-img-wrap::after {
            content: "🔍 点击放大";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: rgba(47,93,58,0.72);
            color: var(--on-accent);
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .album-img-wrap:hover::after {
            opacity: 1;
        }
        /* 大图查看遮罩 */
        .img-viewer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,20,12,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            cursor: zoom-out;
            padding: 30px;
        }
        .img-viewer.show { display: flex; }
        .img-viewer img {
            max-width: 94%;
            max-height: 92%;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.55);
            object-fit: contain;
        }
        .img-viewer-close {
            position: fixed;
            top: 16px; right: 26px;
            color: var(--on-accent);
            font-size: 40px;
            line-height: 1;
            cursor: pointer;
            z-index: 1101;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--glass-weak);
            transition: 0.2s;
        }
        .img-viewer-close:hover {
            background: var(--glass-hover);
            transform: rotate(90deg);
        }
        .img-viewer-name {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            color: var(--on-accent);
            font-size: 17px;
            background: rgba(47,93,58,0.7);
            padding: 8px 22px;
            border-radius: 20px;
            z-index: 1101;
        }
        /* ===== 外貌图鉴弹窗 ===== */
        .appearance-modal {
            max-width: 560px;
            text-align: center;
        }
        .appearance-img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 14px;
            cursor: zoom-in;
            display: block;
            margin: 4px auto 16px;
            border: 1px solid var(--border-soft);
            transition: transform 0.25s ease;
        }
        .appearance-img:hover {
            transform: scale(1.02);
        }
        .appearance-name {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            margin: 8px 0 12px;
        }
        .appearance-desc {
            color: var(--text-sub);
            font-size: 15.5px;
            line-height: 1.9;
            text-align: left;
            background: var(--soft-bg);
            padding: 18px 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-light);
            margin-bottom: 6px;
        }
        .appearance-tip {
            color: var(--text-mute);
            font-size: 13px;
            margin-top: 12px;
        }
    

        /* =====================================================
           玻璃拟态全局覆盖（追加在样式末尾，后定义优先）
           ===================================================== */
        html { background: var(--bg-from); }
        :root[data-theme="dark"] html { background: var(--bg-from); }
        body {
            background-color: transparent;
            background-image: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-mid) 45%, var(--bg-to) 100%), url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,50 C30,30 40,70 50,50 C60,30 70,70 80,50' stroke='%23dcecd8' stroke-width='1.4' fill='none' opacity='0.45'/%3E%3Cpath d='M0,20 C10,10 20,30 30,20 C40,10 50,30 60,20' stroke='%23dcecd8' stroke-width='1.1' fill='none' opacity='0.35'/%3E%3Cpath d='M0,80 C10,70 20,90 30,80 C40,70 50,90 60,80' stroke='%23dcecd8' stroke-width='1.1' fill='none' opacity='0.35'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
        }
        /* 柔和彩色光斑背景 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 12% 18%, var(--blob1), transparent 45%),
                radial-gradient(circle at 88% 12%, var(--blob2), transparent 42%),
                radial-gradient(circle at 75% 85%, var(--blob3), transparent 45%),
                radial-gradient(circle at 15% 88%, var(--blob4), transparent 42%);
            pointer-events: none;
        }
        /* 顶部标题栏玻璃化 */
        .top-bar {
            background: var(--glass) !important;
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            box-shadow: var(--shadow-glass);
            position: sticky;
            top: 10px;
            z-index: 900;
            padding: 16px 50px 12px;
            margin-bottom: 24px;
        }
        .top-bar h1 { color: var(--primary-dark); text-shadow: 0 1px 2px var(--glass-hover); }
        .top-bar p { color: var(--text-sub); }
        /* 主要容器玻璃化 */
        .daily-flower,
        .home-card,
        .card,
        .modal,
        .search-box input,
        .back-btn,
        .filter-bar button,
        .input-item input,
        .input-item textarea,
        .input-item select,
        .album-card,
        .guide-card {
            background: var(--glass) !important;
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
        }
        .daily-flower { border-left: 7px solid var(--primary-light); }
        .home-card:hover,
        .card:hover,
        .album-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glass-lg);
        }

    localStorage.setItem("flowerTheme", t);
    const opts = document.querySelectorAll(".theme-option");
    opts.forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-theme-val") === t);

}
function setTheme(t) { applyTheme(t); }
function openSettings() {
    applyTheme(getTheme());

}

    {name:"金钱树", category:"草本", light:"喜散光耐阴，严禁暴晒", water:"肉质根茎储水极强，极少浇水，积水烂根必死", fertilizer:"春夏薄肥，秋冬停肥", tip:"叶片成对生长，寓意圆满招财", flowerLanguage:"金钱树花语：‘招财纳福、富贵圆满、兴旺顺遂’。叶片翠绿成对，象征团圆美满、财源不断。", coldKnowledge:"金钱树学名雪铁芋，无主茎、地下块根储水；极少开花，开花被视为吉兆；耐阴好养，适合办公室居家。"},
    {name:"茉莉", category:"木本", light:"喜强光喜日晒，越晒越香越开花", water:"喜湿润，生长期勤浇水，避免干旱", fertilizer:"花期前磷钾肥勤施，花后修剪补肥", tip:"‘晒不死的茉莉，阴不死的栀子’，光照是开花关键", flowerLanguage:"茉莉花语：‘忠贞爱情、质朴纯洁、迷人芬芳、默默守护’。花香清雅脱俗，象征纯粹专一的情感，寓意温柔长久、岁岁芬芳。", coldKnowledge:"茉莉是世界著名香花，花香可安神舒缓；‘花开满园香’，花期集中在夏秋；修剪越勤、分枝越多、开花越密；可制作花茶香包精油。"},
    {name:"满天星", category:"草本", light:"喜充足光照，全日照养护最佳", water:"喜干燥透气，忌积水", fertilizer:"生长期通用肥，花期磷钾肥", tip:"分枝密集花量巨大，适合盆栽插花", flowerLanguage:"满天星花语：‘甘愿做配角的爱、默默守护、纯粹温柔、无尽思念’。花朵细小繁多、簇拥成团，象征默默无闻、温柔长久的陪伴。", coldKnowledge:"满天星常作插花配花，但本身极具美感；花期超长，干花可永久保存；寓意低调温柔、不争不抢。"},
    {name:"郁金香", category:"草本", light:"喜充足光照，冷凉环境生长最佳", water:"见干见湿，忌积水烂球", fertilizer:"生长期薄肥，花期停肥", tip:"耐寒怕热，夏季休眠", flowerLanguage:"郁金香花语：‘博爱、体贴、高雅、富贵、真诚祝福’。花型端庄优雅，象征高贵温柔、真挚美好，寓意生活雅致顺遂。", coldKnowledge:"郁金香是荷兰国花，品种繁多色彩丰富；属球根花卉，夏季高温休眠；耐寒性极强，冬季可露天越冬；象征胜利与美好。"},
    {name:"洋桔梗", category:"草本", light:"明亮散射光，怕暴晒，喜温暖柔和环境", water:"土干再浇，保持透气，忌积水", fertilizer:"生长期薄肥勤施", tip:"花型高级花期长，观赏性极强", flowerLanguage:"洋桔梗花语：‘真诚不变的爱、永世不忘、温柔坚定’。花型优雅高级，象征坚定不移的心意与长久的美好。", coldKnowledge:"洋桔梗常被误认为玫瑰，花期比玫瑰更长；花色清新高级，是网红切花；养护简单，室内盆栽可反复开花。"},
    {name:"三角梅", category:"木本", light:"喜全日照，越晒开花越爆，缺光不开花", water:"花期控水，偏干养护促花苞", fertilizer:"催花专用磷钾肥勤施", tip:"喜热喜光，耐旱不耐涝，修剪促分枝", flowerLanguage:"三角梅花语：‘热情、坚韧不拔、顽强奋进’。开花热烈繁盛、花期超长，象征积极向上、永不言弃的生活态度。", coldKnowledge:"三角梅又叫叶子花，花期可长达全年；控水、多晒、勤修剪是爆花三要素；南方露天全年开花，北方室内春夏秋开花。"},
    {name:"仙人球", category:"多肉", light:"喜强光全日照，极度喜光", water:"全年极少浇水，宁干勿湿", fertilizer:"春夏极少量缓释肥", tip:"懒人必备，几乎养不死", flowerLanguage:"仙人球花语：‘坚强、刚毅、外刚内柔、守护幸福’。外表坚硬带刺，内心柔软坚韧，象征坚强独立、默默守护。", coldKnowledge:"仙人球夜间释放氧气适合卧室；抗辐射、耐干旱、耐贫瘠；开花寓意好运将至；生命力极其顽强。"},
    {name:"文竹", category:"草本", light:"喜散光怕暴晒，阴凉湿润环境最佳", water:"保持微湿，经常喷雾增湿", fertilizer:"稀薄观叶肥，少施勤施", tip:"枝叶轻盈雅致，喜湿润怕干燥", flowerLanguage:"文竹花语：‘文雅、从容、永恒、真挚友谊’。姿态清雅飘逸，象征君子之风、淡然从容。", coldKnowledge:"文竹自古是文人雅花，寓意书香门第；枝叶轻盈极具国风美感；干燥、暴晒、积水是黄叶主因。"},
    {name:"太阳花", category:"草本", light:"全日照暴晒养护，越晒开花越多", water:"耐旱耐晒，土干浇水", fertilizer:"通用薄肥即可", tip:"生命力超级顽强，俗称‘死不了’", flowerLanguage:"太阳花花语：‘勇敢、热烈、积极向上、永远向阳’。永远朝向阳光绽放，象征乐观开朗、不惧风雨。", coldKnowledge:"太阳花生命力极强，掐枝即活、落地生根；花期从春末开到深秋；光照越足花越密集，阴天闭合晴天开放。"},
    {name:"兰花", category:"草本", light:"柔和散射光，严禁暴晒", water:"润而不涝，透气为主", fertilizer:"兰花专用肥薄施", tip:"喜通风喜湿润，怕闷热积水", flowerLanguage:"兰花花语：‘高雅、纯洁、淡泊、君子气度’。花中四君子之一，象征清雅脱俗、品德高尚。", coldKnowledge:"兰花是传统名花，象征高洁品格；根系肉质怕积水，必须用透气植料；喜阴凉通风，忌高温闷热。"},
    {name:"铜钱草", category:"草本", light:"喜光耐阴，光照足叶片圆润翠绿", water:"可水培可土培，喜水湿不怕水多", fertilizer:"通用液肥半月一次", tip:"长势迅猛，爆盆速度极快", flowerLanguage:"铜钱草花语：‘财源滚滚、团圆美满、平安富贵’。叶片圆润似铜钱，象征招财纳福、圆满顺遂。", coldKnowledge:"铜钱草水陆两栖极好养活；光照充足、水分充足即可快速爆盆；寓意招财聚财，是热门吉祥绿植。"},
    {name:"绣球", category:"木本", light:"明亮散射光，避开正午烈日，上午柔和阳光最佳", water:"喜湿润，保持微湿不积水，高温早晚叶面喷水", fertilizer:"春生长期复合肥，孕蕾期磷酸二氢钾；调蓝用硫酸铝", tip:"花色随土壤酸碱度改变，大花绣球需低温春化才能大量开花", flowerLanguage:"绣球花语是‘团圆美满、希望、忠贞、永恒’。数十朵小花簇拥成圆润饱满的花球，代表相聚团圆，象征家人朋友长久相伴；也寓意绝境之中依然存有希望。", coldKnowledge:"绣球颜色由土壤pH值和铝离子共同决定；原产我国四川一带，后传入欧洲改良；花瓣上的大花实为不孕花，真正小花藏在花球内部；全株含微量毒素不可食用。"},
    {name:"风信子", category:"草本", light:"充足柔和光照，缺光花茎徒长倒伏，光太强缩短花期", water:"水培水面距球根1cm不浸泡种球；土培见干见湿忌积水", fertilizer:"出芽后薄施磷钾肥，现蕾后补肥，开花后停肥", tip:"典型秋植球根，低温春化才开花，花后养球夏季休眠", flowerLanguage:"风信子花语是‘点燃生命之火，纵享丰富人生’，代表永远的怀念、爱意与幸福。开花香气浓烈馥郁，象征重生与新生，寓意告别过往遗憾，开启崭新美好生活。", coldKnowledge:"风信子原产地中海沿岸，是著名香花球根；花香浓度高，密闭卧室勿大量摆放；种球汁液有刺激性，修剪建议戴手套；早春开花，是欧美经典春季花卉。"},
    {name:"白掌（一帆风顺）", category:"草本", light:"明亮散射光，耐阴性优秀，不能强光直射，过暗不开花", water:"保持微润，缺水叶片立刻下垂，积水易烂根，空气干燥多喷雾", fertilizer:"生长期薄施磷钾肥促花，氮肥过多只长叶不开花", tip:"叶片下垂优先检查缺水，对氨气甲醛净化能力强", flowerLanguage:"白掌花语是‘一帆风顺、平安顺遂、纯洁安宁’。洁白佛焰花苞如同扬起的白帆，寓意事业生活一路顺畅，无灾无难；象征内心平和纯净，万事称心如意。", coldKnowledge:"白掌又叫白鹤芋，白色部分不是花瓣而是特化的苞片，真正小花是中间肉穗；缺水时叶片会自动下垂，补水后短时间恢复；汁液有轻微刺激性避免误食。"},
    {name:"红掌", category:"草本", light:"明亮散射光，忌烈日暴晒，光照合适花色红艳", water:"保持微润，土表发干再补水，忌积水，喜高空气湿度", fertilizer:"花期持续施磷钾肥，薄肥勤施，氮肥过多只长叶", tip:"花期极长，单朵花可维持2-3个月，常年可开花", flowerLanguage:"红掌花语：大展宏图、热情热血、鸿运当头。火红的苞片象征热烈的祝福，寓意事业腾飞、前程似锦，也代表热烈真挚的感情，适合开业乔迁摆放。", coldKnowledge:"红掌又名花烛，红色部分同样是苞片，中间肉穗花序才是小花；原产热带雨林喜温暖高湿怕冷；花期持久是全球畅销切花；汁液含草酸钙勿入口。"},
    {name:"小木槿", category:"木本", light:"全日照，光照越足开花量越大，缺光徒长花苞少", water:"生长快耗水大，土表干了就浇，夏季早晚补水", fertilizer:"薄肥勤施，生长期通用肥，孕蕾期磷酸二氢钾", tip:"修剪关键，花后剪残花打顶促分枝；生长飞快易爆盆", flowerLanguage:"小木槿花语：温柔坚韧、珍惜当下、生生不息。花朵轻盈秀气持续开放，代表平凡日子里源源不断的美好，寓意温柔而强大，珍惜眼前每一段时光。", coldKnowledge:"小木槿是南非葵并非木槿，只是外形相似；生长速度在开花灌木里属第一梯队，温度合适几乎全年开花；毛细根多不耐闷根，土壤透气是养护重点。"},
    {name:"蓝雪花", category:"木本", light:"全日照最佳，半阴也能生长但开花变少", water:"见干见湿，旺盛期需水量大，夏季高温补水", fertilizer:"春夏生长期通用复合肥搭配磷钾肥交替施用", tip:"耐修剪，耐热性强，夏天持续开花，怕冷低温会冻伤", flowerLanguage:"蓝雪花花语：冷淡、忧郁、勇敢、率真。清新淡雅的淡蓝色花朵自带清冷气质，寓意即便身处困境，依旧保有勇敢乐观的本心，安静从容不随波逐流。", coldKnowledge:"蓝雪花原产南非，耐热能力强，是夏季花园主力；蓝色在花卉里属少见的冷色调；枝条柔软可牵引做成花墙花柱；低温低于5℃易冻伤，北方冬季室内养护。"},
    {name:"蟹爪兰", category:"多肉", light:"明亮散射光，短日照花卉，秋冬孕育花苞，强光灼伤叶片", water:"肉质茎储水，干透浇透，孕蕾期勿频繁搬动防掉苞", fertilizer:"秋天增施磷钾肥促花苞，开花后、夏季高温停肥", tip:"短日照植物，秋天黑夜足够才长花苞；嫁接长势更强", flowerLanguage:"蟹爪兰花语：鸿运当头、运转乾坤、锦上添花。花朵垂吊盛开，花期临近圣诞新年，寓意好运降临，喜事接踵而至，生活锦上添花。", coldKnowledge:"蟹爪兰是仙人掌科植物，原生环境是热带雨林附生植物，不是沙漠仙人掌；茎节像螃蟹爪子得名；孕蕾期挪动花盆极易大量落蕾；花期冬春是热门年宵花卉。"},
    {name:"酢浆草", category:"草本", light:"全日照，光照充足开花爆盆，阴天夜晚花朵闭合", water:"见干见湿，球根怕积水，雨季控水", fertilizer:"生长期薄肥，孕蕾期磷钾肥，休眠停水停肥", tip:"品种繁多，休眠时地上枯萎地下球根留存来年发芽", flowerLanguage:"酢浆草花语：璀璨的心、爱国、欢乐。小巧精致的小花向阳开放，象征简单纯粹的快乐，寓意拥抱平凡生活里细碎的美好，永远保持乐观欢喜。", coldKnowledge:"酢浆草分布全球，园艺品种花色丰富；属球根类小草花，繁殖能力极强；花朵感夜性傍晚闭合，太阳升起重新绽放；叶片含草酸不可大量食用。"},
    {name:"天竺葵", category:"草本", light:"充足散射光，春秋多晒，夏季高温遮阴", water:"见干见湿，忌积水闷根，夏季高温休眠减少浇水", fertilizer:"春秋生长季薄肥，孕蕾磷钾肥，夏冬停肥", tip:"有特殊气味可驱赶部分蚊虫，夏季高温休眠注意通风降温", flowerLanguage:"天竺葵花语：幸福就在身边、思念、怀念。花朵成团盛开色彩丰富，代表微小而触手可及的幸福，寓意珍惜身边人，藏着绵长温柔的思念。", coldKnowledge:"天竺葵原产南非，是阳台经典开花植物；叶片有独特挥发性香气可驱赶蚜虫小飞虫；很多香氛产品使用天竺葵精油；夏季怕闷热高温高湿易黑腐需通风。"},
    {name:"倒挂金钟", category:"木本", light:"明亮散射光，怕夏季烈日暴晒，凉爽环境生长最佳", water:"保持微润不积水，高温休眠期控水，缺水易落叶", fertilizer:"春秋薄肥勤施，孕蕾磷钾肥，夏季高温完全停肥", tip:"喜凉怕热，夏天高温极易休眠死亡，俗称‘夏必死’", flowerLanguage:"倒挂金钟花语：相信爱情、热烈的心、永远相信美好。花朵向下垂吊像一盏盏精致小灯笼，寓意怀揣热忱，永远相信爱与希望。", coldKnowledge:"倒挂金钟又名灯笼花，花朵造型独特像悬挂的花灯；原生凉爽山地极怕高温闷热，28℃以上生长变差32℃极易枯萎；修剪打顶可促分枝花量翻倍。"},
    {name:"玫瑰", category:"木本", light:"全日照，每日6小时直射阳光，缺光徒长开花少", water:"见干见湿，花期保持微湿，严禁积水，雨后排水通风", fertilizer:"生长期复合肥，孕蕾期磷酸二氢钾，花后修剪补肥", tip:"与月季易混淆，玫瑰叶片褶皱刺密；高湿不通风易黑斑白粉病", flowerLanguage:"玫瑰花语：爱情、浪漫、美好、真挚告白。不同花色寓意不同，红玫瑰代表热恋，白玫瑰代表纯洁，粉玫瑰代表心动。玫瑰象征热烈真挚的爱意，是传递心意的经典花卉。", coldKnowledge:"真正的玫瑰大多一年只开一次花，市面上情人节售卖的切花玫瑰实际是现代月季；玫瑰叶片表面褶皱背面带绒毛；花瓣可提取玫瑰精油用于香水护肤品。"},
    {name:"牡丹", category:"木本", light:"全日照，充足阳光，夏季正午适当遮阴", water:"耐旱怕涝，干透浇透，雨季一定排水，积水极易烂根", fertilizer:"秋冬基肥，春季孕蕾磷钾肥，花后补肥，夏季停肥", tip:"喜凉需低温春化才能开花；‘牡丹长一尺退八寸’，秋天适合栽种", flowerLanguage:"牡丹花语：富贵圆满、雍容华贵、吉祥繁荣。牡丹被誉为花中之王，象征高贵、繁荣与吉祥，寓意家业兴旺、富贵安康。", coldKnowledge:"牡丹是中国十大名花之首，自古被尊为花王；适合秋季移栽，春天移栽不容易开花；品种繁多花色丰富；牡丹根皮就是中药丹皮。"},
    {name:"向日葵", category:"草本", light:"全日照，必须充足直射阳光，缺光植株瘦弱花盘小", water:"苗期控水蹲苗，花期保持土壤湿润，忌积水烂根", fertilizer:"生长期氮肥壮苗，孕蕾期增施磷钾肥促花盘膨大", tip:"花盘会跟随太阳转动，成熟后固定朝东；长势快需足够空间", flowerLanguage:"向日葵花语：沉默的爱、忠诚、阳光、积极向上。永远向着太阳，象征乐观温暖不惧困难，寓意满怀希望，永远向阳而生。", coldKnowledge:"向日葵追随太阳的现象只出现在花蕾阶段，花朵完全开放后不再转动；种子就是葵花籽；植株体内生长素造成向光弯曲；高大品种可长到两米以上。"},
    {name:"康乃馨", category:"草本", light:"喜充足散射光，春秋多晒，夏季中午适当遮阴，光照不足枝条徒长、开花少", water:"见干见湿，盆土微润不积水，花期需水量大，忌涝根", fertilizer:"生长期每周一次稀薄通用液肥，孕蕾期增施磷酸二氢钾，花后追肥复壮", tip:"花茎易弯折，生长期及时摘心打顶促分枝；喜凉爽，夏季高温生长变慢", flowerLanguage:"康乃馨的花语是‘母爱、温馨、真情、尊敬’。它是公认的母亲花，花瓣层叠温柔，象征母爱的无私与包容，寓意感恩与敬爱，代表对亲人温暖长久的牵挂，也寄托健康平安的美好祝愿。", coldKnowledge:"康乃馨是世界四大切花之一，全球品种超千种；原产地中海沿岸，是石竹科代表花卉；花香清甜，花瓣可食用，常用于花茶与甜点点缀；母亲节赠送康乃馨的习俗源于美国，后风靡全球。"},
    {name:"雏菊", category:"草本", light:"喜充足光照，全日照或明亮散射光均可，缺光易徒长倒伏", water:"见干见湿，忌积水，盆土透气优先", fertilizer:"生长期薄肥勤施，花期前增施磷钾肥", tip:"花量巨大，适合密植盆栽或花坛点缀；花后及时修剪可再次开花", flowerLanguage:"雏菊的花语是‘天真、纯洁、深藏在心底的爱、和平与希望’。花朵小巧素净、清丽可人，象征单纯美好的心灵与不掺杂质的感情，也代表藏在心底、默默祝福的温柔爱意。", coldKnowledge:"雏菊原产欧洲，是意大利的国花；花名源自拉丁语‘太阳之花’，因日出开放、日暮闭合得名；雏菊可入药，有清热消炎的民间用法；它还是欧洲占卜爱情‘他爱我，他不爱我’的经典道具花。"},
    {name:"芍药", category:"草本", light:"喜充足阳光，全日照最佳，夏季暴晒适当遮阴", water:"喜湿润怕积水，生长期保持微湿，花期控水防烂根", fertilizer:"秋冬施基肥，春季孕蕾期磷钾肥，花后补肥养根", tip:"有‘花相’美誉，与牡丹并称‘花中二绝’；秋季分株移栽最佳", flowerLanguage:"芍药的花语是‘情有独钟、依依惜别、真诚不变’。花开雍容大气、芳香清雅，象征真挚专一的爱恋与离别时的深情不舍，古代以芍药相赠寄托相思，寓意美丽端庄、情深意重。", coldKnowledge:"芍药是我国传统名花，栽培历史超三千年；‘牡丹为王，芍药为相’，同属芍药科；芍药根可入药，即中药白芍；单朵花期虽短，但花型硕大、色彩艳丽，是‘花仙’般的存在。"},
    {name:"龟背竹", category:"草本", light:"喜明亮散射光，耐阴性好，忌强光直射，暴晒叶片灼伤发黄", water:"喜湿润，盆土保持微湿，叶面经常喷雾增湿，忌积水", fertilizer:"春秋每月一次稀薄氮钾肥，冬季停肥", tip:"叶片开孔裂叶是成熟标志；攀援植物，可绑支柱引导向上生长", flowerLanguage:"龟背竹的花语是‘健康长寿、坚韧顽强、平安富贵’。叶片宽大奇特、常年翠绿，象征旺盛的生命力与坚韧不拔的品格，寓意健康平安、福寿绵长，是经典的居家吉祥观叶植物。", coldKnowledge:"龟背竹原产墨西哥热带雨林，是大型攀援观叶植物；叶片开孔裂叶是为了让雨水透过、避免损伤，是长期进化的结果；能有效净化室内空气，吸附甲醛等有害物质；夜间同样释放氧气，适合卧室摆放。"},
    {name:"蝴蝶兰", category:"草本", light:"喜明亮散射光，忌强光直射，冬季可适当多晒", water:"水苔栽种见干见湿，根部发白再浇水，忌积水烂根", fertilizer:"生长期稀薄兰花专用肥，花期前增施磷钾肥，冬季低温停肥", tip:"肉质气生根，需透气透水；花梗开花后可从花梗节间剪除，促二次开花", flowerLanguage:"蝴蝶兰的花语是‘幸福向你飞来、高贵优雅、丰盛富足’。花型如翩翩彩蝶，姿态优雅飘逸，象征美好幸福不期而至，寓意事业有成、爱情甜蜜、生活富足美满，是春节和乔迁的热门馈赠佳礼。", coldKnowledge:"蝴蝶兰是兰科蝴蝶兰属，原产东南亚热带雨林，附生于树干岩石上；单枝花箭可开十几朵花，花期长达2-3个月；是‘洋兰皇后’，也是全球销量最大的兰科盆花；对温度敏感，低于15℃易落花。"},
    {name:"君子兰", category:"草本", light:"喜柔和散射光，忌强光直射，光线过强叶片发黄", water:"见干见湿，肉质根怕积水，宁干勿湿", fertilizer:"春秋施稀薄复合肥，孕蕾期磷钾肥，冬季低温停肥", tip:"叶片整齐对称排列为佳品；每年换盆一次，肉质根需透气植料", flowerLanguage:"君子兰的花语是‘君子谦谦、温和有礼、高贵脱俗’。叶片挺拔如剑、花姿端庄大方，象征品行高洁、淡泊从容的君子之风，寓意家庭和睦、事业顺利，是象征品德与福气的经典室内名花。", coldKnowledge:"君子兰原产南非，是石蒜科常绿草本；寿命可达数十年，能年年开花；叶片有吸附灰尘、净化空气的作用；民间认为君子兰开花是家宅吉兆；它开花对温差有要求，秋冬昼夜温差大才易抽箭。"},
    {name:"米兰", category:"木本", light:"喜充足光照，全日照最佳，光照越足开花越香", water:"见干见湿，生长期保持微润，花期控水防落花", fertilizer:"生长期薄肥勤施，花期前磷钾肥，冬季停肥", tip:"花香浓郁清雅，花小如米粒故称米兰；喜温暖怕寒冷，冬季需室内过冬", flowerLanguage:"米兰的花语是‘有爱就有生命、平凡中的伟大’。花朵细碎金黄、香气沁人，不张扬却芬芳持久，象征平凡日子里朴素而深沉的付出与爱，寓意默默奉献、岁月留香。", coldKnowledge:"米兰学名米仔兰，是楝科常绿灌木；花虽小但香气极浓，可提炼香精；原产我国华南及东南亚，是传统香花植物；花期长，温度适宜可四季开花；民间常盆栽于庭院，寓意吉祥如意。"},
    {name:"杜鹃花", category:"木本", light:"喜半阴半阳，春秋多晒，夏季遮阴防晒，忌烈日暴晒", water:"喜湿润，盆土保持微湿，忌积水，浇水用晾过的水", fertilizer:"喜酸性土壤，生长期稀薄酸性肥，孕蕾期磷钾肥，忌浓肥", tip:"土壤碱化易黄叶；花后及时修剪残花；喜凉爽通风，怕闷热", flowerLanguage:"杜鹃花的花语是‘永远属于你、繁荣昌盛、思乡之情’。花开热烈烂漫、漫山遍野，象征真挚炽烈的情感与对故土家园的眷恋，寓意生活红红火火、家业繁荣兴旺，是充满生机与热情的吉祥之花。", coldKnowledge:"杜鹃花是我国十大名花之一，有‘花中西施’美誉；全世界杜鹃品种超900种，我国是主要原产地；杜鹃花也是著名的酸性指示植物，土壤酸碱度直接影响长势；部分野生杜鹃全株有毒，观赏即可不可误食。"},
    {name:"山茶花", category:"木本", light:"喜半阴环境，忌烈日暴晒，冬季可全日照", water:"喜湿润，盆土保持微润，花期控水，忌积水烂根", fertilizer:"喜酸性肥，生长期薄肥勤施，孕蕾期磷钾肥，冬季停肥", tip:"花苞发育期不可随意搬动、换盆，易落蕾；喜凉爽怕高温", flowerLanguage:"山茶花的花语是‘理想的爱、谦让、高洁、谨慎’。花瓣层叠如锦、色彩饱满，盛开于寒冬早春，象征不惧风霜的高洁品格与深藏不露的理想之爱，寓意坚贞不渝、典雅端庄。", coldKnowledge:"山茶花是我国传统名花，栽培历史超千年；花期恰逢春节前后，是喜庆吉祥的年宵花；茶花品种繁多，有‘十八学士’等经典名品；花与叶均可入药，有凉血止血的民间用法；树龄可达数百年，长盛不衰。"},
    {name:"铃兰", category:"草本", light:"喜半阴凉爽环境，忌烈日暴晒，散射光养护最佳", water:"喜湿润，盆土保持微湿，空气干燥时喷雾增湿", fertilizer:"生长期稀薄液肥，花期前磷钾肥，休眠期停肥", tip:"喜冷凉，夏季高温会休眠枯萎；地栽可成片繁殖，盆栽需透气土壤", flowerLanguage:"铃兰的花语是‘幸福归来、纯洁、温柔、不变的守候’。花朵如串串洁白小铃铛，垂挂枝头、清香怡人，象征纯净美好的情感与失而复得的幸福，寓意温柔守候、岁月静好，是极具治愈感的祝福之花。", coldKnowledge:"铃兰原产北半球温带，是百合科多年生草本；法国人每年五月一日互赠铃兰，象征好运与幸福；铃兰全株有毒，尤其是根茎，观赏养护需远离宠物和儿童；它是‘香水之都’格拉斯的重要调香原料。"},
    {name:"紫罗兰", category:"草本", light:"喜充足光照，全日照或明亮散射光，缺光植株瘦弱", water:"见干见湿，忌积水，盆土透气优先", fertilizer:"生长期薄肥勤施，花期前增施磷钾肥", tip:"花香淡雅，花量大，适合盆栽与切花；花后修剪可促二次开花", flowerLanguage:"紫罗兰的花语是‘永恒的美、质朴、美德、清凉的爱’。花色淡雅、香气清幽，象征朴实真挚的情感与恒久不变的美丽，寓意平淡生活中的优雅与从容，适合表达温柔长久的爱意。", coldKnowledge:"紫罗兰原产地中海沿岸，是十字花科草本植物；花可食用，常用于沙拉点缀与糖渍装饰；古罗马人将其视为爱与美的象征；紫罗兰的香气能舒缓情绪，是经典香氛原料；花期在春季，是欧洲园林经典花材。"},
    {name:"薰衣草", category:"草本", light:"喜充足光照，全日照最佳，光照不足植株松散、香气变淡", water:"耐旱怕涝，盆土干透再浇，宁干勿湿", fertilizer:"生长期极少施肥，贫瘠土壤长势更好，忌浓肥", tip:"土壤需排水极好，怕闷热潮湿；花后修剪可促二次开花", flowerLanguage:"薰衣草的花语是‘等待爱情、宁静致远、纯洁感恩’。紫蓝色花穗随风摇曳，香气清幽安神，象征对爱情的执着等待与内心的平和宁静，寓意驱散烦恼、心怀感恩，是治愈系花卉的代表。", coldKnowledge:"薰衣草原产地中海地区，是唇形科多年生草本；花、茎、叶均含芳香油，是香薰、精油、护肤品的经典原料；名字源于拉丁语‘清洗’，古罗马人用它沐浴熏香；花穗晒干可制作香包，有助眠安神的民间用法。"},

// ===================== 模块6：花卉图鉴渲染 =====================
function renderAlbum() {
    const wrap = document.getElementById("albumList");
    if (!wrap) return;
    let html = `<div class="disease-sub-title">🖼️ 花卉图鉴（共 ${flowerGuideData.length} 种），点击卡片欣赏花朵外貌</div><div class="album-grid">`;
    flowerGuideData.forEach(item => {
        const imgSrc = imageMap[item.name] || "";
        const imgHtml = imgSrc
            ? `<img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">`
            : `<div style="height:120px;display:flex;align-items:center;justify-content:center;color:#7a9480;font-size:40px;">🌷</div>`;
        html += `
        <div class="album-card" onclick="openAppearance('${item.name}')">
            ${imgSrc ? `<div class="album-img-wrap" onclick="event.stopPropagation(); openImgViewer('${imgSrc}', '${item.name}')">${imgHtml}</div>` : imgHtml}
            <p>${item.name}</p>
        </div>`;
    });
    html += `</div>`;
    wrap.innerHTML = html;
}
// ===================== 本地存储工具 =====================
function getStorage(key) {
    const data = localStorage.getItem(key);
    try { return data ? JSON.parse(data) : []; } catch (e) { return []; }
}
function setStorage(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
}

// ===================== 日期工具（禁止未来日期） =====================
function getNowDateStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
}

// ===================== 页面切换 =====================
function openSubPage(pageId) {
    document.getElementById("homePage").style.display = "none";
    document.querySelectorAll('.sub-page').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add("active");
    if (pageId === "guide") renderGuide();
    if (pageId === "album") renderAlbum();
    if (pageId === "myplant") renderMyPlant();
}
function backHome() {
    document.getElementById("homePage").style.display = "grid";
    document.querySelectorAll('.sub-page').forEach(el => el.classList.remove('active'));
}

function openModal() { document.getElementById("plantModal").classList.add("show"); }

function closeModal() { document.getElementById("plantModal").classList.remove("show"); }

function closeImgViewer() {

function openAppearance(name) {
    const plant = flowerGuideData.find(p => p.name === name);
    if (!plant) return;
    const imgSrc = imageMap[name] || "";
    const desc = appearanceMap[name] || "暂无外貌描述，敬请期待。";

        ? `<img class="appearance-img" src="${imgSrc}" alt="${name}" title="点击放大" onclick="openImgViewer('${imgSrc}', '${name}')">`
        : "";

        <div class="appearance-desc">${desc}</div>
        <div class="appearance-tip">💡 点击上方大图可再次放大查看</div>

});

// ===================== 模块2：全局搜索（修复版：首页即可用，弹出结果浮层） =====================
function getSearchResult(keyword) {
    const kw = keyword.toLowerCase().trim();
    if (!kw) return { guide: [], disease: [] };
    const guide = flowerGuideData.filter(i =>
        i.name.toLowerCase().includes(kw) ||
        i.tip.toLowerCase().includes(kw) ||
        i.flowerLanguage.toLowerCase().includes(kw) ||
        i.category.toLowerCase().includes(kw)
    );
    const disease = diseaseData.filter(i =>
        i.plantName.toLowerCase().includes(kw) ||
        i.symptom.toLowerCase().includes(kw) ||
        i.solve.toLowerCase().includes(kw)
    );
    return { guide: guide, disease: disease };
}

//渲染搜索结果浮层
function renderSearchResult(keyword) {
    const res = getSearchResult(keyword);
    const listBox = document.getElementById("searchResultList");
    //病害匹配涉及的花卉（去重，未在攻略匹配中出现过的）
    const diseasePlants = [];
    res.disease.forEach(d => {
        if (!diseasePlants.includes(d.plantName)) diseasePlants.push(d.plantName);
    });
    const extraPlants = diseasePlants.filter(p => !res.guide.some(g => g.name === p));

    document.getElementById("searchModalTitle").textContent =
        "搜索结果（花卉" + res.guide.length + "条 / 病害" + res.disease.length + "条）";

    let html = "";
    if (res.guide.length === 0 && extraPlants.length === 0) {
        html = `<div class="empty-tip">没有找到与「${keyword}」相关的内容<br>试试输入：月季、绿萝、黄叶、黑斑...</div>`;
    }
    res.guide.forEach(item => {
        html += `
        <div class="search-result-item" onclick="openPlantDetail('${item.name}')">
            <h4>${item.name} <span class="category-tag">${item.category}</span><span class="match-type">攻略匹配</span></h4>
            <p>${item.tip}</p>
        </div>`;
    });
    extraPlants.forEach(p => {
        const item = flowerGuideData.find(f => f.name === p);
        if (item) {
            html += `
            <div class="search-result-item" onclick="openPlantDetail('${item.name}')">
                <h4>${item.name} <span class="category-tag">${item.category}</span><span class="match-type">病害匹配</span></h4>
                <p>${item.tip}</p>
            </div>`;
        }
    });
    listBox.innerHTML = html;
}

//搜索框监听：输入即弹出搜索结果浮层（初始首页直接可用）
document.getElementById("searchInput").addEventListener("input", function () {
    const kw = this.value.trim();
    if (kw === "") {
        document.getElementById("searchModal").classList.remove("show");
        return;
    }
    renderSearchResult(kw);
    openSearchModal();
});

// ===================== 模块3：植物攻略库 =====================
function renderCategoryFilter() {
    const filterWrap = document.getElementById("categoryFilter");
    let html = "";
    categoryList.forEach(cat => {
        const active = cat === currentCategory ? "active" : "";
        html += `<button class="${active}" onclick="changeCategory('${cat}')">${cat}</button>`;
    });
    filterWrap.innerHTML = html;
}
function changeCategory(catName) {
    currentCategory = catName;
    renderCategoryFilter();
    renderGuide();
}
function renderGuide(searchList = flowerGuideData) {
    let list = searchList;
    if (currentCategory !== "全部") {
        list = list.filter(item => item.category === currentCategory);
    }
    const wrap = document.getElementById("guideList");
    if (list.length === 0) {
        wrap.innerHTML = `<div class="empty-tip">没有找到匹配的花卉攻略</div>`;
        return;
    }
    let html = `<div class="disease-sub-title">🌿 攻略库已收录 ${list.length} 种花卉，点卡片查看完整攻略 + 专属病虫害用药</div>`;
    list.forEach(item => {
        const imgSrc = imageMap[item.name] || "";
        const imgHtml = imgSrc ? `<img class="gc-img" src="${imgSrc}" alt="${item.name}" onerror="this.style.display='none'">` : "";
        const dCount = getDiseaseByPlantName(item.name).length;
        const dBadge = dCount > 0 ? `<span class="disease-count-badge">🌡️ 病害 ${dCount} 条</span>` : "";
        html += `
        <div class="card guide-card" onclick="openPlantDetail('${item.name}')">
            ${imgHtml}
            <div class="gc-main">
                <h4>${item.name} <span class="category-tag">${item.category}</span>${dBadge}</h4>
                <p>☀光照：${item.light.substring(0, 34)}...</p>
                <p>💧浇水：${item.water.substring(0, 34)}...</p>
                <p>📌贴士：${item.tip}</p>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
}
// ===================== 花卉详情弹窗 =====================
function openPlantDetail(plantName) {
    const plant = flowerGuideData.find(p => p.name === plantName);
    if (!plant) return;
    const relatedDisease = getDiseaseByPlantName(plantName);
    let diseaseHtml = "";
    if (relatedDisease.length > 0) {
        relatedDisease.forEach(d => {
            diseaseHtml += `
            <div class="card" style="cursor:default;">
                <span class="sick-tag">病害诊疗（含用药）</span>
                <p><b>症状：</b>${d.symptom}</p>
                <p><b>诱因：</b>${d.reason}</p>
                <p><b>✅解决方案+用药：</b>${d.solve}</p>
            </div>`;
        });
    } else {
        diseaseHtml = `<p style="color:#7a9480;">暂无该花卉相关病害记录</p>`;
    }
    document.getElementById("modalContent").innerHTML = `
        <h3 style="color:#2f5d3a;margin-bottom:12px;">${plant.name} <span class="category-tag">${plant.category}</span></h3>
        <div class="knowledge-block"><strong>💐 完整花语</strong>：${plant.flowerLanguage}</div>
        <div class="knowledge-block"><strong>💡 花卉冷知识</strong>：${plant.coldKnowledge}</div>
        <div class="card" style="cursor:default;">
            <p><b>☀光照要求</b>：${plant.light}</p>
            <p><b>💧浇水方法</b>：${plant.water}</p>
            <p><b>🧪施肥方案</b>：${plant.fertilizer}</p>
            <p><b>📌养护核心贴士</b>：${plant.tip}</p>
        </div>
        <h4 style="color:#2f5d3a;margin:14px 0 10px;">🌡️ 该花卉专属病虫害诊疗（带具体药品）</h4>
        ${diseaseHtml}
    `;
    openModal();
}

// ===================== 模块4：种植打卡（修复未来日期BUG） =====================
function addMyPlant() {
    const name = document.getElementById("addPlantName").value.trim();
    const date = document.getElementById("addPlantDate").value;
    const nowDate = getNowDateStr();
    if (!name || !date) {
        alert("请完整填写花卉名称和种下日期！");
        return;
    }
    if (date > nowDate) {
        alert("❌禁止选择未来日期！请选择今日或过往日期");
        return;
    }
    const myPlants = getStorage("myPlants");
    myPlants.push({ name: name, startDate: date, id: Date.now() });
    setStorage("myPlants", myPlants);
    document.getElementById("addPlantName").value = "";
    document.getElementById("addPlantDate").value = "";
    renderMyPlant();
    alert("✅种植记录添加成功！种植天数自动更新");
}
function getPlantDays(startDateStr) {
    const start = new Date(startDateStr);
    const now = new Date();
    const diffTime = now.getTime() - start.getTime();
    if (diffTime <= 0) return 0;
    return Math.floor(diffTime / (1000 * 60 * 60 * 24));
}
function renderMyPlant() {
    const myPlants = getStorage("myPlants");
    const wrap = document.getElementById("myPlantList");
    if (myPlants.length === 0) {
        wrap.innerHTML = `<div class="empty-tip">暂无种植记录，添加你的第一盆花卉吧</div>`;
        return;
    }
    let html = "";
    myPlants.forEach(item => {
        const day = getPlantDays(item.startDate);
        html += `
        <div class="card" style="cursor:default;">
            <h4>${item.name}</h4>
            <span class="plant-day-tag">已种植 ${day} 天</span>
            <p>📅种下日期：${item.startDate}</p>
            <button class="btn btn-danger" style="margin-top:8px;" onclick="delPlant(${item.id})">删除这条记录</button>
        </div>`;
    });
    wrap.innerHTML = html;
}
function delPlant(id) {
    let myPlants = getStorage("myPlants");
    myPlants = myPlants.filter(p => p.id !== id);
    setStorage("myPlants", myPlants);
    renderMyPlant();
}
